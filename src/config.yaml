short:
  # Common Parameters
  input_window: 672
  output_horizon: 96
  min_input_window: 96
  target_column: "actual_load"
  train_split: 0.8
  val_split: 0.1
  num_workers: 4
  epochs: 50
  early_stopping_patience: 10

  # LSTM Final Tuned Parameters (from Short HPO)
  lstm:
    run_tag: "final_generalization_lstm_short"
    learning_rate: 0.00088633582449202
    lags: [1, 2, 96, 192, 288, 672]
    feature_scaler: "MinMax"
    target_scaler: "MinMax"
    lstm_units: 48
    dropout_rate: 0.1572721153508268
    batch_size: 16
    loss_function: "mae"
    exogenous_features: ["hour_sin", "hour_cos", "weekday_sin", "weekday_cos", "month_sin", "month_cos", "is_daylight", "year", "weekend_flag", "holiday_flag", "temperature", "solar_capacity", "solar_generation", "wind_capacity", "wind_generation", "wind_offshore_capacity", "wind_offshore_generation", "wind_onshore_capacity", "wind_onshore_generation"]

  # TFT Final Tuned Parameters (from Short HPO)
  tft:
    run_tag: "final_generalization_tft_short"
    learning_rate: 0.000925426218427021
    hidden_size: 64
    attention_head_size: 1
    dropout: 0.10171797299074353
    batch_size: 16
    gradient_clip_val: 0.1
    exogenous_features_tft: ["hour", "is_daylight", "month", "year", "weekday", "weekend_flag", "holiday_flag", "temperature", "solar_capacity", "solar_generation", "wind_capacity", "wind_generation", "wind_offshore_capacity", "wind_offshore_generation", "wind_onshore_capacity", "wind_onshore_generation"]

